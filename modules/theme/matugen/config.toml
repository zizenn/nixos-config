[config]
mode = "dark"
type = "scheme-neutral"
contrast = 0.0

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = ["~/.config/kitty/current-colors.conf"]

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim-colors.json"
output_path = ["~/.cache/matugen/themes/nvim-colors.json"]

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = ["~/.config/rofi/colors.rasi"]

[templates.zed]
input_path = "~/.config/matugen/templates/zed-theme.json"
output_path = ["~/.config/zed/themes/matugen.json"]

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = ["~/.config/waybar/colors.css"]

[templates.obsidian]
input_path = "~/.config/matugen/templates/obsidian.css"
output_path = ["~/Documents/vault/.obsidian/snippets/matugen.css"]

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop.css"
output_path = ["~/.config/vesktop/themes/matugen.theme.css"]

[templates.mako]
input_path = "~/.config/matugen/templates/mako.conf"
output_path = ["~/.config/mako/config"]

[templates.wleave]
input_path = "~/.config/matugen/templates/wleave.css"
output_path = ["~/.config/wleave/style.css"]

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = ["~/.config/gtk-3.0/gtk.css"]

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4.css"
output_path = ["~/.config/gtk-4.0/gtk.css"]

[templates.kvantum]
input_path = "~/.config/matugen/templates/kvantum/Matugen.kvconfig"
output_path = ["~/.config/Kvantum/Matugen.kvconfig"]

[templates.starship]
input_path = "~/.config/matugen/templates/starship.toml"
output_path = ["~/.config/starship/matugen.toml"]

[hooks]
post_run = "for SOCK in /tmp/kitty-zizenn-* 2>/dev/null; do [ -S \"$SOCK\" ] && kitty @ --to=\"unix:$SOCK\" set-colors --all --configured ~/.config/kitty/current-colors.conf 2>/dev/null; done; makoctl reload 2>/dev/null; pkill waybar 2>/dev/null; waybar & disown; kvantummanager --set Matugen 2>/dev/null; true"
