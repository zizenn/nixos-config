[audio]
enable_overdrive = true

[backdrop]
enabled = true

[bar]
order = [ "mainPanel" ]

    [bar.mainPanel]
    background_opacity = 0.4999999888241291
    capsule = true
    capsule_radius = 0
    center = [ "active_window" ]
    end = [ "tray", "group:g1" ]
    font_family = "JetBrainsMono Nerd Font"
    font_scale = 0.89999998733401299
    font_weight = 400
    padding = 4
    radius = 0
    reserve_space = false
    scale = 0.95000000670552254
    shadow = false
    smart_auto_hide = true
    start = [ "clock", "workspaces" ]
    thickness = 33

        [[bar.mainPanel.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "notifications", "session" ]
        opacity = 1.0
        padding = 6.0
        radius = 0.0
        widget_spacing = 10

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    name = "cal"
    type = "google"

[control_center]
hidden_tabs = [ "power", "network", "bluetooth", "screen-time" ]
width = 790

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000004", "desktop-widget-0000000000000006", "desktop-widget-0000000000000007" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 352.0
    box_width = 496.0
    cx = 1608.0
    cy = 364.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "calendar"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background_radius = 0
        show_week_numbers = false

    [desktop_widgets.widget.desktop-widget-0000000000000006]
    box_height = 368.0
    box_width = 240.0
    cx = 1480.0
    cy = 740.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000006.settings]
        background_radius = 0
        bands = 32
        show_when_idle = true

    [desktop_widgets.widget.desktop-widget-0000000000000007]
    box_height = 368.0
    box_width = 240.0
    cx = 1736.0
    cy = 740.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000007.settings]
        background_radius = 0
        stat = "cpu_usage"
        stat2 = "cpu_temp"

[dock]
radius = 0

[hooks]
colors_changed = "hyprctl reload; pkill -SIGUSR1 nvim"

[keybinds]
down = [ "Down", "Alt+j" ]
left = [ "Left", "Alt+h" ]
right = [ "Right", "Alt+l" ]
up = [ "Up", "Alt+k" ]

[location]
auto_locate = true

